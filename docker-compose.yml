services:
  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      # Browser Origin when you open the UI (match host:port you publish for web).
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        VITE_API_BASE: ""
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
