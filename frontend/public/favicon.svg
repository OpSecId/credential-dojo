<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="Credential Dojo">
  <title>Credential Dojo — zen mark</title>
  <defs>
    <linearGradient id="enso-ink" x1="12%" y1="18%" x2="88%" y2="82%">
      <stop offset="0%" stop-color="#7a8fa8" />
      <stop offset="55%" stop-color="#5c6d82" />
      <stop offset="100%" stop-color="#8f7d6a" />
    </linearGradient>
  </defs>
  <!-- Zen enso: one breath, left open (ma) -->
  <circle
    cx="24"
    cy="24"
    r="12.75"
    fill="none"
    stroke="url(#enso-ink)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-dasharray="58 24"
    transform="rotate(-24 24 24)"
    opacity="0.95"
  />
  <!-- Warm accent at the opening — subtle hi (非) / not-yet fullness -->
  <path
    d="M 34.2 13.6c1.1.35 1.65 1.05 1.35 1.9"
    stroke="#c9a86e"
    stroke-width="1.35"
    stroke-linecap="round"
    fill="none"
    opacity="0.88"
  />
</svg>
